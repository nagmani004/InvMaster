version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: inventory_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inventory_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: 
      context: ./backend
    container_name: inventory_backend
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/inventory_db
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
